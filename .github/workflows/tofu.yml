# OpenTofu 파이프라인 (GitHub-hosted runner → 공유기 포트포워딩 → Proxmox API)
#
#  - Pull Request → main : fmt / validate / plan (plan 결과는 Job Summary 에 표시)
#  - Push → main (PR merge): plan → 변경이 있으면 apply → 암호화된 state 를 main 에 커밋
#  - 수동 실행 (Actions 탭 → Run workflow, main 브랜치): plan, 선택 시 apply
#  - 스택은 template → k8s 순서로 하나씩 실행 (k8s 는 template 의 템플릿 VM 을 clone)
#
# 필요 Secrets (README 참고): PROXMOX_ENDPOINT, PROXMOX_API_TOKEN, TF_STATE_PASSPHRASE
name: tofu

on:
  pull_request:
    branches: [main]
    paths:
      - "template/**"
      - "k8s/**"
      - ".github/workflows/tofu.yml"
  push:
    branches: [main]
    paths:
      - "template/**"
      - "k8s/**"
      - ".github/workflows/tofu.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "plan 후 apply 까지 실행 (main 브랜치에서만 동작)"
        type: boolean
        default: false

permissions:
  contents: read

# state 를 저장소에 커밋하므로 main/수동 실행은 하나씩 순서대로 처리 (진행 중인 apply 는 취소하지 않음)
# PR plan 은 state 를 쓰지 않으므로 그룹을 분리 (같은 그룹이면 대기 중인 main apply 를 PR 실행이 밀어내 취소시킴)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tofu-plan-{0}', github.ref) || 'tofu-state' }}
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.11.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  tofu:
    name: tofu (${{ matrix.stack }})
    # 포크 PR 에는 Secrets 가 전달되지 않으므로 실행하지 않음
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      # 정의 순서대로 하나씩 실행, 앞 스택이 실패하면 뒤 스택은 취소 (fail-fast)
      max-parallel: 1
      matrix:
        stack: [template, k8s]
    timeout-minutes: 60
    permissions:
      contents: write # apply 후 state 커밋
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    env:
      STACK: ${{ matrix.stack }}
      TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
      TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
      TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 이전 실행이 main 에 커밋한 최신 state 를 사용 (실행 시점의 커밋이 뒤처져 있을 수 있음)
      - name: Sync latest state from main
        working-directory: .
        run: |
          git fetch --depth=1 origin main
          if git cat-file -e origin/main:state 2>/dev/null; then
            git checkout origin/main -- state/
          fi
          ls -la state/

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Check secrets
        run: |
          missing=0
          for v in proxmox_endpoint proxmox_api_token state_passphrase; do
            name="TF_VAR_${v}"
            if [ -z "${!name}" ]; then echo "::error::${name} 에 해당하는 Secret 이 비어 있습니다"; missing=1; fi
          done
          exit $missing

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      - name: tofu init
        run: tofu init

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        id: plan
        run: |
          set +e
          tofu plan -detailed-exitcode -out=tfplan
          ec=$?
          set -e
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          # 0: 변경 없음, 2: 변경 있음, 1: 에러
          if [ "$ec" -eq 1 ]; then exit 1; fi

      - name: Plan summary
        if: steps.plan.outcome == 'success'
        run: |
          {
            echo "### tofu plan: \`${STACK}\`"
            if [ "${{ steps.plan.outputs.exitcode }}" = "0" ]; then
              echo "변경 사항 없음 ✅"
            else
              echo '```'
              tofu show -no-color tfplan | tail -c 60000
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: tofu apply
        id: apply
        if: >-
          steps.plan.outputs.exitcode == '2' && github.ref == 'refs/heads/main' && (
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.apply)
          )
        run: tofu apply -auto-approve tfplan

      # apply 가 실패해도 일부 리소스가 생성됐을 수 있으므로 state 는 항상 커밋
      - name: Commit encrypted state
        if: always() && steps.apply.outcome != 'skipped' && steps.apply.outcome != ''
        working-directory: .
        run: |
          # 새 state 를 따로 보관한 뒤, 최신 main 위에 state 파일만 덮어써서 커밋 (rebase 충돌 방지)
          new_state="$(mktemp -d)"
          cp -a state/. "$new_state"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch --depth=1 origin main
            git checkout -q -f -B state-commit origin/main
            cp -a "$new_state"/. state/
            git add state/
            if git diff --cached --quiet; then
              echo "state 변경 없음"
              exit 0
            fi
            git commit -q -m "chore(state): update ${STACK} state [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "push 실패, 재시도 ${i}/3"; sleep 5
          done
          echo "::error::state 커밋을 main 에 push 하지 못했습니다. 브랜치 보호 규칙을 확인하세요."
          exit 1

      - name: Cleanup plan file
        if: always()
        run: rm -f tfplan
